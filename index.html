<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2630"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Armas Adam">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>html{-webkit-text-size-adjust:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Armas Adam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: faixa de aço com a marca no topo; a tela inicial lista as armas; cada arma abre
   suas próprias abas no rodapé (Resumo, Registro, Guias, Munição, Treinos). */
:root{
  --bg:#e8ebee;--card:#f8f9fa;--ink:#141a20;--mut:#57626d;--line:#d2d7dc;--soft:#dde2e7;
  --steel:#1b2630;--steel2:#263440;--on-steel:#eef2f5;--steel-mut:#a3b3c0;
  --btn:#1b2630;--on-btn:#ffffff;
  --brass:#876312;--brass-bg:#efe2bf;--brass-hi:#d9b25e;
  --ok:#1c6a43;--ok-bg:#d6ecdf;--warn:#8a5206;--warn-bg:#f5e4bf;--bad:#a1261e;--bad-bg:#f5dad6;
  --disp:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f12;--card:#151a1f;--ink:#e7ecf0;--mut:#8b97a2;--line:#262e36;--soft:#1c232a;
  --steel:#161d24;--steel2:#1f2932;--on-steel:#eef2f5;--steel-mut:#8fa1af;
  --btn:#d4ab52;--on-btn:#14181c;
  --brass:#d9b25e;--brass-bg:#382d13;--brass-hi:#d9b25e;
  --ok:#70cf9b;--ok-bg:#15301f;--warn:#e6b35c;--warn-bg:#35280e;--bad:#f08b7f;--bad-bg:#3a1a16;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f12;--card:#151a1f;--ink:#e7ecf0;--mut:#8b97a2;--line:#262e36;--soft:#1c232a;
  --steel:#161d24;--steel2:#1f2932;--on-steel:#eef2f5;--steel-mut:#8fa1af;
  --btn:#d4ab52;--on-btn:#14181c;
  --brass:#d9b25e;--brass-bg:#382d13;--brass-hi:#d9b25e;
  --ok:#70cf9b;--ok-bg:#15301f;--warn:#e6b35c;--warn-bg:#35280e;--bad:#f08b7f;--bad-bg:#3a1a16;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brass)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-size:.9em;letter-spacing:.02em}


body.lk{overflow:hidden}
#launch{position:fixed;inset:0;z-index:50;background:#0c0f12;color:#eef2f5;overflow:auto}
#launch[hidden]{display:none!important}
.lbg{position:absolute;inset:0;background:#10161c url(fundo-armas.jpg) center top/cover no-repeat}
.lsh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,15,18,.55) 0%,rgba(12,15,18,.05) 28%,rgba(12,15,18,.15) 48%,rgba(12,15,18,.88) 78%,rgba(12,15,18,.96) 100%)}
.lin{position:relative;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 34px) 22px calc(env(safe-area-inset-bottom,0px) + 26px);max-width:520px;margin:0 auto}
.lbrand{display:flex;align-items:center;gap:12px}
.lbrand .mark{width:46px;height:46px}
.lbrand b{font:700 34px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.lbrand b span{color:#d9b25e}
.ltag{margin:10px 0 0;color:#d6dee5;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.lbox{margin-top:auto;padding-top:300px;display:flex;flex-direction:column;gap:11px}
.lg-tabs{display:flex;gap:6px;background:rgba(20,26,32,.7);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:4px;backdrop-filter:blur(8px)}
.lg-tabs button{flex:1;border:0;background:transparent;color:#a3b3c0;padding:9px;border-radius:9px;font-weight:600;font-size:15px}
.lg-tabs button.on{background:#d9b25e;color:#14181c}
#lgForm{display:flex;flex-direction:column;gap:10px}
#launch input[type=email],#launch input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(12,15,18,.72);color:#fff;font:inherit;backdrop-filter:blur(8px)}
#launch input::placeholder{color:#8b97a2}
.lg-chk{display:flex;align-items:center;gap:9px;color:#d6dee5;font-size:14.5px}
.lg-chk input{width:20px;height:20px;accent-color:#d9b25e}
.lg-btn{border:0;border-radius:12px;padding:15px;background:#d9b25e;color:#14181c;font:700 17px var(--body);letter-spacing:.02em}
.lg-btn:disabled{opacity:.6}
.lg-lnk{background:none;border:0;color:#d6dee5;text-decoration:underline;padding:6px;font-size:14.5px}
.lg-err{margin:0;color:#ffb3a9;font-size:14px;min-height:0}
.lg-fine{margin:0;color:#8b97a2;font-size:12.5px;text-align:center}
.lg-hi{color:#d6dee5;font-size:15px}.lg-hi b{display:block;color:#fff;font-size:18px;overflow-wrap:anywhere}
.lsig{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:92px;opacity:.9;pointer-events:none}
.chipst{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--on-steel);border-radius:99px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
.chipst[data-st="0"]{color:#f0c97a}.chipst[data-st="1"]{color:#8fe0b2}
#cfg{z-index:25}
.police{display:block;width:100%;text-align:left;margin:16px 0 4px;padding:15px 16px;border:0;border-radius:14px;background:linear-gradient(135deg,#d9b25e,#b88a2c);color:#14181c}.police b{display:block;font:700 22px/1.1 var(--disp);letter-spacing:.04em;text-transform:uppercase}.police span{font-size:14px}
.pol .ax button.th{width:96px;height:96px}
.hero .wrap{padding-top:calc(26px + env(safe-area-inset-top,0px))}header.top{padding-top:env(safe-area-inset-top,0px)}
/* marca */
.hero{background:linear-gradient(160deg,var(--steel2),var(--steel));color:var(--on-steel);border-bottom:3px solid var(--brass-hi)}
.hero .wrap{padding-block:26px 22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;flex:none}
.brand b{font:700 34px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase}
.brand b span{color:var(--brass-hi)}
.hero p{margin-top:12px;color:var(--steel-mut);font-size:15px}
.hero p b{color:var(--on-steel)}
.ban{background:var(--warn-bg);color:var(--warn);font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}

/* títulos de seção */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px}
.sec h2,.lbl{font:600 14px/1.2 var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.note{color:var(--mut);font-size:13.5px;margin-top:10px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--btn);color:var(--on-btn);border:0;border-radius:10px;padding:9px 14px;font-size:14.5px;font-weight:600;white-space:nowrap}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:6px 11px;font-size:13.5px}
.btn:active{transform:scale(.98)}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row>div{min-width:0}
.nm{font-weight:600}
.sub{color:var(--mut);font-size:14px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:transparent;color:var(--mut);border:1px dashed var(--line)}
.pill.info{background:var(--soft);color:var(--ink)}

/* arma na tela inicial */
.arma{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;margin-bottom:12px;overflow:hidden}
.arma .a-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 4px}
.arma .a-nm{font:700 25px/1.1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.arma .a-cal{font:600 15px var(--mono);color:var(--brass);white-space:nowrap}
.arma .a-sub{display:block;padding:0 16px 12px;color:var(--mut);font-size:14px}
.arma .a-rows{display:block;border-top:1px solid var(--line)}
.arma .a-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 16px;font-size:14px}
.arma .a-row+.a-row{border-top:1px solid var(--line)}
.arma .a-row em{font:600 13px var(--disp);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.add{display:block;width:100%;background:transparent;border:1.5px dashed var(--line);border-radius:14px;padding:14px;color:var(--mut);font-weight:600}
.link{display:flex;width:100%;text-align:left;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.link svg{width:24px;height:24px;flex:none;color:var(--brass)}
.link .t{flex:1;min-width:0}
.link .t b{display:block}
.link .t span{color:var(--mut);font-size:13.5px}
.link .v{font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.al{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.al.bad{border-left-color:var(--bad)}

.al small{display:block;color:var(--mut);font-size:13px}

/* app */
#app{padding-bottom:92px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--steel);color:var(--on-steel);border-bottom:2px solid var(--brass-hi)}
header.top .in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:720px;margin:0 auto}
header.top .back{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--on-steel);border-radius:9px;padding:6px 11px;font-size:14px;white-space:nowrap}
header.top .t{flex:1;min-width:0;line-height:1.15}
header.top .t b{display:block;font:700 21px/1.1 var(--disp);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
header.top .t span{font-size:13px;color:var(--steel-mut)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:flex;max-width:720px;margin:0 auto}
nav.tabs button{flex:1;min-width:0;background:none;border:0;padding:9px 2px 8px;color:var(--mut);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brass);font-weight:700}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* situação */
.go{border-radius:14px;padding:14px;margin:16px 0 10px;border:1px solid var(--line)}
.go.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.go.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.go.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.go b{display:block;font:700 20px/1.15 var(--disp);letter-spacing:.03em;text-transform:uppercase}
.go span{font-size:14px}
.sit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.sit:first-child{border-top:0;padding-top:2px}
.sit:last-child{padding-bottom:2px}
.bx{display:block;min-width:0}
.sit small{display:block;color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font:700 clamp(20px,6.2vw,27px)/1.1 var(--disp);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--mut);font-size:13px}
.regua{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:12px}
.regua i{display:block;height:100%;background:var(--ok);border-radius:9px}
.regua.warn i{background:var(--warn)}.regua.bad i{background:var(--bad)}.regua.brass i{background:var(--brass)}
.reg-l{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);margin-top:5px;font-variant-numeric:tabular-nums}
dl.dados{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:0}
dl.dados div{min-width:0}
dl.dados dt{font:600 12px var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
dl.dados dd{margin:1px 0 0;font-weight:500;overflow-wrap:anywhere}
.ax{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ax button.th{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.ax button.th img{width:100%;height:100%;object-fit:cover;display:block}
.ax button.pdf{font:inherit;text-align:left;cursor:pointer}
#pv{position:fixed;inset:0;z-index:40;background:#111;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#pv .pb{display:flex;gap:10px;padding:10px 12px;align-items:center}
#pv .pb span{flex:1;color:#fff;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pv .pb button{background:#fff;color:#111;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
#pv iframe{flex:1;border:0;background:#fff;width:100%}
.ax a.pdf,.ax span.pdf{display:inline-flex;align-items:center;min-height:64px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;text-decoration:none;color:var(--ink);background:var(--soft);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.item .v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 14px;color:var(--mut);border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font:700 21px var(--disp);letter-spacing:.03em;text-transform:uppercase;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* gastos */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.total{font:700 38px/1.05 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:150px;margin-top:14px}
.chart .col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .col span{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;margin-bottom:3px}
.chart .col i{display:block;width:100%;background:var(--brass);border-radius:4px 4px 0 0;min-height:2px}
.chart .col i.z{background:var(--line)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:5px;border-top:1px solid var(--line);padding-top:4px}
.months span{font-size:10.5px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.03em}
.cats{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.cat .row{font-size:14px;align-items:baseline}
.cat .regua{margin-top:4px;height:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{font:600 12px var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

/* regularização */
.chk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.card>.chk:first-child{border-top:0}
.chk .mk{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:1px}
.chk .mk.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.chk .mk.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chk .mk.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.chk .mk.auto{border-radius:99px}
.chk .tx{min-width:0;flex:1}
.chk .tx b{display:block;font-weight:600}
.chk .tx small{display:block;color:var(--mut);font-size:13.5px}
.ref{margin:0;padding:0;list-style:none}
.ref li{padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.ref li:first-child{border-top:0;padding-top:0}
.ref li b{display:block;font:600 13px var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--brass)}
.fontes{font-size:13.5px;color:var(--mut);padding-left:18px;margin:8px 0 0}
.fontes li{margin-bottom:4px;overflow-wrap:anywhere}
select.sel{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}

/* formulário */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet .p{background:var(--card);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:700 24px/1.1 var(--disp);letter-spacing:.03em;text-transform:uppercase}
.sheet h3{font:600 13px var(--disp);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;min-width:0;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.sheet textarea{min-height:70px;resize:vertical}
.sheet .hint{font-size:12.5px;color:var(--mut);margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{min-width:0}
.sheet .fa{display:flex;gap:8px;margin-top:22px}
.sheet .fa .btn{flex:1;padding:13px 8px}
.axe{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.axe span{min-width:0;overflow-wrap:anywhere}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=String(s).split('-');return new Date(+a,+b-1,+c)};
const diff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const hoje=()=>iso(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?String(s).split('-').reverse().join('/'):'—';
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmt=n=>(n||0).toLocaleString('pt-BR');
const pl=(n,s,p)=>fmt(n)+' '+(n===1?s:(p||s+'s'));
const sum=(L,f)=>L.reduce((t,x)=>t+(Number(f(x))||0),0);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function num(v){
  if(v==null)return null;let s=String(v).trim().replace(/[R$\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const x=parseFloat(s);return isFinite(x)?x:null;
}
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ICON={
  resumo:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="11" width="8" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/>',
  registro:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h5M7 14h9"/>',
  guias:'<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h5.5"/>',
  municao:'<path d="M9 21V10c0-3 1.2-5.5 3-7 1.8 1.5 3 4 3 7v11z"/><path d="M9 17h6"/>',
  treinos:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
  docs:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  gastos:'<path d="M3 20h18M6 20v-8M11 20V5M16 20v-6"/>',
  regular:'<path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'
};
ICON.habit=ICON.treinos;
ICON.policia='<path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.3 6.8 19l1-5.8L3.6 9.1l5.8-.8z"/>';
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- estado ---------- */
const COLS=['armas','guias','docs','gastos','treinos'];
const S={armas:[],guias:[],docs:[],gastos:[],treinos:[],perfil:{nivel:1,checks:{}}};
let db=null,assets=null,ready=false,dirty=false;
const got={};
let V={scr:'home',arma:null,tab:'resumo'};
const G={ano:hoje().slice(0,4),cat:'',arma:''};
const NIV={
  1:{t:8,c:0,mun:4000,mun22:8000,txt:'8 treinos ou competições em 12 meses'},
  2:{t:12,c:4,mun:10000,mun22:16000,txt:'12 treinos e 4 competições em 12 meses'},
  3:{t:20,c:6,mun:20000,mun22:32000,txt:'20 treinos e 6 competições em 12 meses'}
};
const nivel=()=>NIV[S.perfil.nivel]||null;
const TIPOS=['Pistola','Revólver','Carabina / Rifle','Espingarda','Outro'];
const GRUPOS=['Arma curta raiada permitida','Arma curta raiada restrita','Arma curta lisa permitida','Arma curta lisa restrita','Arma longa raiada permitida','Arma longa raiada restrita','Arma longa lisa permitida','Arma longa lisa restrita'];
const CATS=['Munição','Taxas e GRU','Clube','Acessórios','Manutenção','Outros'];
const DOCT=['CR','Documento com foto (RG/CNH)','Filiação a clube','Laudo psicológico','Capacidade técnica','Certidões negativas','Declaração de Segurança do Acervo','Autorização de manejo (SIMAF/Ibama)','Certificado de Regularidade (CTF/Ibama)','Declaração de acesso à propriedade','Outro'];
const FINS=['Treinamento','Competição','Caça / manejo','Manutenção','Mudança de endereço do acervo','Outra'];

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const armaDe=id=>S.armas.find(a=>a.id===id);
const blob=id=>blobUrl(id);

/* ---------- gravação ---------- */
async function put(col,o){
  S[col]=S[col].filter(x=>x.id!==o.id).concat(o);
  if(!db){toast('Sem conexão: não ficou salvo');return false}
  try{await db.doc(col+'/'+o.id).set(o);return true}catch(e){toast('Não salvou. Tente de novo.');return false}
}
async function del(col,id){
  const o=S[col].find(x=>x.id===id);S[col]=S[col].filter(x=>x.id!==id);
  if(!db)return;
  try{await db.doc(col+'/'+id).delete()}catch(e){toast('Não apagou. Tente de novo.');return}
  if(assets&&o&&o.anexos)for(const a of o.anexos){try{await assets.delete(a.id)}catch(e){}}
}
async function putPerfil(p){
  S.perfil=p;
  if(!db){toast('Sem conexão: não ficou salvo');return}
  try{await db.doc('config/perfil').set(p)}catch(e){toast('Não salvou. Tente de novo.')}
}

/* ---------- regras de validade ---------- */
function st(val,warn){
  if(!val)return{k:'none',t:'sem validade informada',n:null};
  const n=diff(val,hoje());
  if(n<0)return{k:'bad',t:'vencido há '+pl(-n,'dia'),n};
  if(n===0)return{k:'bad',t:'vence hoje',n};
  if(n<=warn)return{k:'warn',t:'vence em '+pl(n,'dia'),n};
  return{k:'ok',t:'válido até '+fd(val),n};
}
const pill=s=>`<span class="pill ${s.k}">${esc(s.t)}</span>`;
function regua(em,val,k){
  if(!em||!val)return'';
  const tot=Math.max(1,diff(val,em)),n=diff(val,hoje());
  const p=Math.min(100,Math.max(0,(tot-n)/tot*100));
  return `<div class="regua ${k||''}"><i style="width:${p.toFixed(1)}%"></i></div><div class="reg-l"><span>emitido ${fd(em)}</span><span>vence ${fd(val)}</span></div>`;
}
/* CR e CRAF: o pedido de renovação deve ser feito até 30 dias antes do vencimento */
function renov(val){
  if(!val)return'';const n=diff(val,hoje());
  if(n<0)return'Vencido. Regularize pelo Sinarm-CAC antes de transportar a arma.';
  if(n<=30)return'O prazo de 30 dias antes do vencimento já passou. Protocole a renovação agora.';
  if(n<=90)return'Peça a renovação até '+fd(addD(val,-30))+' (30 dias antes do vencimento).';
  return'Renovação: pedir até '+fd(addD(val,-30))+'.';
}
const docCR=()=>S.docs.filter(d=>d.tipo==='CR').sort((a,b)=>(b.validade||'').localeCompare(a.validade||''))[0];
const stCR=()=>{const c=docCR();return c?st(c.validade,60):{k:'none',t:'CR não cadastrado',n:null}};
const stCRAF=a=>a.crafValidade?st(a.crafValidade,60):{k:'none',t:'CRAF sem validade',n:null};
const guiasDe=id=>S.guias.filter(g=>g.arma===id);
function stGuia(a){
  const L=guiasDe(a.id).filter(g=>!g.arq&&g.validade),h=hoje();
  const at=L.filter(g=>g.validade>=h).sort((x,y)=>y.validade.localeCompare(x.validade));
  if(at.length){const s=st(at[0].validade,7);if(s.k==='ok')s.t='guia válida até '+fd(at[0].validade);return s}
  if(L.length)return{k:'bad',t:'guia vencida',n:-1};
  return{k:'none',t:'nenhuma guia',n:null};
}
function habit(a){
  const ini=addD(hoje(),-365),h=hoje();
  const ids=new Set(S.armas.filter(x=>a.grupo?x.grupo===a.grupo:x.id===a.id).map(x=>x.id));
  const L=S.treinos.filter(t=>ids.has(t.arma)&&t.data>=ini&&t.data<=h);
  const co=L.filter(t=>t.tipo==='Competição').length,tr=L.length-co,N=nivel();
  if(!N)return{tr,co,tot:L.length,ok:true,meta:0,feito:L.length,txt:pl(L.length,'evento')+' em 12 meses'};
  if(!N.c)return{tr,co,tot:L.length,ok:L.length>=N.t,meta:N.t,feito:L.length,txt:L.length+' de '+N.t+' em 12 meses'};
  return{tr,co,tot:L.length,ok:tr>=N.t&&co>=N.c,meta:N.t+N.c,feito:Math.min(tr,N.t)+Math.min(co,N.c),txt:tr+'/'+N.t+' treinos · '+co+'/'+N.c+' competições'};
}
const is22=c=>/^\.?22(\s*l\.?r\.?)?$/i.test(String(c||'').trim());
function munAno(ano){
  const L=S.gastos.filter(g=>g.categoria==='Munição'&&(g.data||'').startsWith(ano));
  let n=0,n22=0;L.forEach(g=>{const a=armaDe(g.arma);if(a&&is22(a.calibre))n22+=g.qtd||0;else n+=g.qtd||0});
  return{n,n22,valor:sum(L,g=>g.valor)};
}
function munArma(a){
  const ano=hoje().slice(0,4),C=S.gastos.filter(g=>g.arma===a.id&&g.categoria==='Munição');
  const cart=sum(C,g=>g.qtd),gasto=sum(C,g=>g.valor),CA=C.filter(g=>(g.data||'').startsWith(ano));
  const tiros=sum(S.treinos.filter(t=>t.arma===a.id),t=>t.tiros);
  return{C,cart,gasto,cartAno:sum(CA,g=>g.qtd),gastoAno:sum(CA,g=>g.valor),tiros,custo:cart?gasto/cart:null,estoque:cart-tiros};
}
/* tudo que tem data de vencimento, do mais urgente ao menos */
function alertas(){
  const L=[];
  S.docs.forEach(d=>{if(d.validade)L.push({nome:d.tipo==='Outro'?(d.titulo||'Documento'):d.tipo,sub:'Documento',s:st(d.validade,d.tipo==='CR'?60:30),act:'geral',id:'docs'})});
  S.armas.forEach(a=>{if(a.crafValidade)L.push({nome:'CRAF',sub:a.nome,s:st(a.crafValidade,60),act:'armaTab',id:a.id+'|registro'})});
  S.guias.forEach(g=>{if(g.arq||!g.validade)return;const s=st(g.validade,7);if(s.n<-30)return;const a=armaDe(g.arma);
    L.push({nome:'Guia de tráfego · '+(g.finalidade||''),sub:a?a.nome:'',s,act:'armaTab',id:g.arma+'|guias'})});
  return L.sort((x,y)=>x.s.n-y.s.n);
}

/* ---------- checklist de regularização ---------- */
function checklist(){
  const N=nivel(),ck=S.perfil.checks||{},ano=hoje().slice(0,4),G1=[],G2=[],G3=[],G4=[];
  const auto=(t,d,s)=>({t,d,auto:s.k,st:s.t});
  const man=(key,t,d)=>({t,d,key,on:!!ck[key]});
  const dc=tp=>S.docs.filter(d=>d.tipo===tp).sort((a,b)=>(b.validade||'').localeCompare(a.validade||''))[0];
  const sdoc=(tp,w)=>{const d=dc(tp);return!d?{k:'none',t:'não cadastrado'}:d.validade?st(d.validade,w):{k:'ok',t:'cadastrado'}};
  G1.push(auto('CR válido','Certificado de Registro na categoria da atividade.',stCR()));
  S.armas.forEach(a=>{
    G1.push(auto('CRAF da '+a.nome,'O número de série do CRAF deve bater com o da arma.',stCRAF(a)));
    G1.push(auto('Guia de tráfego da '+a.nome,'Vale só para o trajeto e a finalidade que estão na guia.',stGuia(a)));
  });
  G1.push(man('foto','Documento oficial com foto','RG ou CNH junto com CR, CRAF e guia.'));
  G1.push(man('desmun','Arma desmuniciada no trajeto','Munição separada, em recipiente próprio.'));
  G1.push(man('finalidade','Comprovante da finalidade','Inscrição na prova, calendário do clube ou ordem de serviço do armeiro.'));
  G2.push(auto('Filiação a clube de tiro','Comprovante de filiação a entidade de tiro desportivo.',sdoc('Filiação a clube',30)));
  if(N)S.armas.forEach(a=>{const h=habit(a);G2.push(auto('Habitualidade · '+a.nome,N.txt+', em eventos distintos.',{k:h.ok?'ok':'warn',t:h.txt}))});
  G2.push(auto('Laudo psicológico','De psicólogo credenciado pela PF. Vale 1 ano para os processos.',sdoc('Laudo psicológico',30)));
  G2.push(auto('Capacidade técnica','Emitida por instrutor credenciado. Vale 1 ano para os processos.',sdoc('Capacidade técnica',30)));
  G2.push(man('certid','Certidões negativas para a renovação','Federal, Estadual, Militar e Eleitoral. Valem 90 dias, tire perto do pedido.'));
  G2.push(man('prazo','Renovação pedida até 30 dias antes do vencimento','CR e CRAF, pelo Sinarm-CAC com login gov.br.'));
  G3.push(man('cofre','Arma guardada em cofre ou caixa metálica','Com tranca, em local de alvenaria. É o que você declara na Declaração de Segurança do Acervo.'));
  G3.push(man('endereco','Endereço do acervo atualizado','Mudou de endereço? Atualize no Sinarm-CAC e peça guia para levar a arma.'));
  if(N){const m=munAno(ano),p=m.n/N.mun;
    G4.push(auto('Limite anual de munição','Nível '+S.perfil.nivel+': até '+fmt(N.mun)+' cartuchos por ano ('+fmt(N.mun22)+' de .22).',{k:p>1?'bad':p>=.9?'warn':'ok',t:fmt(m.n)+' de '+fmt(N.mun)+' em '+ano}))}
  G4.push(man('nf','Notas fiscais de munição guardadas','Compra só no calibre das armas registradas. Anexe a nota em cada lançamento.'));
  return[['Ao sair de casa com a arma',G1],['Para manter o CR em dia',G2],['Em casa',G3],['Munição',G4]];
}
function chkResumo(){let ok=0,tot=0;checklist().forEach(([,L])=>L.forEach(i=>{tot++;if(i.auto?i.auto==='ok':i.on)ok++}));return{ok,tot}}

/* ---------- telas ---------- */
function render(){
  $('#home').hidden=V.scr!=='home';$('#app').hidden=V.scr==='home';
  if(V.scr==='home')return home();
  if(V.scr==='arma'){const a=armaDe(V.arma);if(!a){V={scr:'home'};return render()}return telaArma(a)}
  telaGeral();
}
function home(){
  const A=alertas().filter(x=>x.s.k!=='ok'),vazio=!S.armas.length&&!S.docs.length;
  $('#heroSt').innerHTML=!ready?'Carregando seus dados…':vazio?'Comece cadastrando sua arma e o seu CR.':A.length?`<b>${pl(A.length,'vencimento')}</b> ${A.length===1?'pede':'pedem'} atenção.`:'<b>Tudo em dia.</b> Nenhum vencimento próximo.';
  if(!ready){$('#homeBody').innerHTML='<div class="sec"><h2>Minhas armas</h2></div><div class="empty">Buscando armas, guias e documentos…</div>';return}
  const ano=hoje().slice(0,4),gAno=sum(S.gastos.filter(g=>(g.data||'').startsWith(ano)),g=>g.valor),cr=stCR(),ck=chkResumo();
  $('#homeBody').innerHTML=
  (A.length?`<div class="sec"><h2>Atenção</h2></div>`+A.map(x=>`<button class="al ${x.s.k}" data-act="${x.act}" data-id="${esc(x.id)}"><span class="bx"><b>${esc(x.nome)}</b><small>${esc(x.sub)}</small></span>${pill(x.s)}</button>`).join(''):'')+
  `<button class="police" data-act="geral" data-id="policia"><b>Mostrar à polícia</b><span>CR, CRAF, guias e autorizações de manejo</span></button>`+
  `<div class="sec"><h2>Minhas armas</h2></div>`+
  (S.armas.length?S.armas.slice().sort((a,b)=>(a.criado||'').localeCompare(b.criado||'')).map(a=>{const h=habit(a);return `<button class="arma" data-act="arma" data-id="${esc(a.id)}">
    <span class="a-top"><span class="a-nm">${esc(a.nome)}</span><span class="a-cal">${esc(a.calibre||'')}</span></span>
    <span class="a-sub">${esc(a.tipo||'Arma')}${a.serie?` · série <code>${esc(a.serie)}</code>`:''}</span>
    <span class="a-rows">
      <span class="a-row"><em>CRAF</em>${pill(stCRAF(a))}</span>
      <span class="a-row"><em>Guia</em>${pill(stGuia(a))}</span>
      ${nivel()?`<span class="a-row"><em>Habitualidade</em><span class="pill ${h.ok?'ok':'info'}">${esc(h.txt)}</span></span>`:''}
    </span></button>`}).join(''):`<div class="empty"><b>Nenhuma arma cadastrada</b>Cadastre a arma para guardar o CRAF, as guias, as compras de munição e os treinos dela.</div>`)+
  `<button class="add" data-act="novaArma" style="margin-top:${S.armas.length?0:12}px">+ Adicionar arma</button>
  <div class="sec"><h2>Geral</h2></div>
  <button class="link" data-act="geral" data-id="docs">${ic('docs')}<span class="t"><b>Meu CR e documentos</b><span>CR, clube, laudos e certidões</span></span><span class="v">${pill({k:cr.k,t:cr.k==='ok'?'em dia':cr.k==='none'?'cadastrar':cr.t})}</span></button>
  <button class="link" data-act="geral" data-id="habit">${ic('treinos')}<span class="t"><b>Habitualidade</b><span>Treinos e competições, todas as armas</span></span><span class="v num">${habitGeral().R.length}<br><small style="font-weight:400;color:var(--mut)">em 12 meses</small></span></button>

function tabs(L){$('#tabs').innerHTML=L.map(([k,l])=>`<button data-act="tab" data-id="${k}" class="${V.tab===k?'on':''}">${ic(k)}${l}</button>`).join('')}

function aResumo(a){

function aRegistro(a){

function guiaCard(g){

function aGuias(a){

function treinoItem(t,comArma){

const grupoDe=t=>{const a=armaDe(t.arma);return t.grupo||(a&&a.grupo)||'Grupo não informado'};
function habitGeral(){
  const h=hoje(),ini=addD(h,-365),R=S.treinos.filter(t=>t.data>=ini&&t.data<=h),G={};

    <p class="note">${N?'Meta do nível '+S.perfil.nivel+': '+esc(N.txt)+', por grupo de armas e em eventos distintos. ':''}A conta aqui usa cada participação lançada. Confirme com o clube como ele conta eventos do mesmo dia.</p></div>`:'')+

async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<1.5e6)return file;
  try{const bmp=await createImageBitmap(file),sc=Math.min(1,2200/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return b&&b.size<file.size?b:file}catch(e){return file}
}

/* ---------- sincronização ---------- */
const stat=(t,k)=>{document.querySelectorAll('.syncSt').forEach(b=>{b.textContent=t;b.dataset.st=k})};
function agenda(){clearTimeout(SYNC_T);stat('Salvo no aparelho','0');SYNC_T=setTimeout(sync,500)}
function rest(path,o={}){return fetch(SB_URL+'/rest/v1/'+path,{...o,headers:{apikey:SB_KEY,Authorization:'Bearer '+SES.at,'Content-Type':'application/json',...(o.headers||{})}})}
async function sync(){
  if(SYNCING||!SES)return;
  if(!navigator.onLine){stat('Sem internet · salvo no aparelho','0');return}
  SYNCING=true;stat('Sincronizando…','1');
  try{
    await ensureTok();
    /* 1) baixa tudo */
    let rows=[],from=0;
    for(;;){
      const r=await rest('registros?select=col,id,data,upd,deleted&order=col,id',{headers:{Range:from+'-'+(from+999)}});
      if(!r.ok)throw new Error('GET '+r.status);
      const p=await r.json();rows=rows.concat(p);if(p.length<1000)break;from+=1000;
    }
    const R={};rows.forEach(x=>R[x.col+'/'+x.id]=x);
    /* 2) mescla: vence o que foi mudado por último */
    const L={};COLS.forEach(c=>S[c].forEach(d=>L[c+'/'+d.id]={c,d}));
    L['config/perfil']={c:'config',d:{...S.perfil,id:'perfil'}};
    const up=[];let mudou=false;
    new Set([...Object.keys(L),...Object.keys(R),...Object.keys(DEL)]).forEach(k=>{
      const[c,...ri]=k.split('/'),id=ri.join('/'),l=L[k],r=R[k];
      const ld=DEL[k]||0,lu=l?(l.d.upd||0):0,lt=Math.max(lu,ld),ldel=ld>=lu&&ld>0;
      if(r&&(r.upd||0)>=lt){
        if((r.upd||0)===lt&&lt>0)return;                        // igual
        mudou=true;
        if(r.deleted){DEL[k]=r.upd;if(c==='config')return;S[c]=S[c].filter(x=>x.id!==id)}
        else{delete DEL[k];
          if(c==='config'){S.perfil={nivel:1,checks:{},...r.data,upd:r.upd}}
          else{S[c]=S[c].filter(x=>x.id!==id).concat({...r.data,upd:r.upd})}}
      }else if(lt>0||l){
        const t=lt||Date.now();
        if(l&&!l.d.upd&&!ldel){l.d.upd=t}
        up.push({user_id:SES.uid,col:c,id,data:ldel?{}:(c==='config'?{...S.perfil}:{...l.d}),upd:t,deleted:!!ldel});
      }
    });
    persist();
    /* 3) envia o que é mais novo aqui */
    for(let i=0;i<up.length;i+=200){
      const r=await rest('registros?on_conflict=user_id,col,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(up.slice(i,i+200))});
      if(!r.ok)throw new Error('POST '+r.status);
    }
    /* 4) anexos */
    await sincAnexos();
    stat('Sincronizado','1');LSs(K('armas_last'),String(Date.now()));
    if(mudou){if(sheetOpen())dirty=true;else render()}
  }catch(e){
    stat(e&&e.message==='expirou'?'Entre de novo':'Sem conexão · salvo no aparelho','0');
  }finally{SYNCING=false}
}
const ANX={err:'',up:0,pend:0,falta:0,tem:0};
async function sincAnexos(){
  ANX.err='';
  const L=await bAll(),mine=L.filter(o=>o.u===SES.uid),have=new Set(mine.map(o=>o.id));
  ANX.tem=mine.filter(o=>o.blob).length;
  for(const o of mine){
    if(o.sent||!o.blob)continue;
    try{
      const r=await fetch(SB_URL+'/storage/v1/object/anexos/'+bKey(o.id),{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SES.at,'x-upsert':'true','Content-Type':o.type||'application/octet-stream'},body:o.blob});
      if(r.ok){o.sent=true;await bPut(o)}else{ANX.err='envio '+r.status+' '+(await r.text()).slice(0,140)}
    }catch(e){ANX.err='envio: '+e.message}
  }
  const want=[];COLS.forEach(c=>S[c].forEach(d=>(d.anexos||[]).forEach(a=>{if(!have.has(a.id))want.push(a)})));
  let novo=false;
  for(const a of want){
    try{
      const r=await fetch(SB_URL+'/storage/v1/object/authenticated/anexos/'+bKey(a.id),{headers:{apikey:SB_KEY,Authorization:'Bearer '+SES.at}});
      if(!r.ok){if(!ANX.err)ANX.err='download '+r.status+' '+(await r.text()).slice(0,140);continue}
      const b=await r.blob();
      await bPut({id:a.id,u:SES.uid,blob:b,type:a.tipo||b.type,sent:true});BU[a.id]=URL.createObjectURL(b);novo=true;
    }catch(e){if(!ANX.err)ANX.err='download: '+e.message}
  }
  const L2=(await bAll()).filter(o=>o.u===SES.uid);
  ANX.tem=L2.filter(o=>o.blob).length;ANX.pend=L2.filter(o=>o.blob&&!o.sent).length;
  const h=new Set(L2.map(o=>o.id));ANX.falta=0;COLS.forEach(c=>S[c].forEach(d=>(d.anexos||[]).forEach(a=>{if(!h.has(a.id))ANX.falta++})));
  if(novo&&!sheetOpen())render();
}
